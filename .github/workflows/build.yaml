name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  project-build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: configure git identity
        run: |
          git config --global user.email "${GIT_CONFIG_USER_EMAIL}"
          git config --global user.name "${GIT_CONFIG_USER_NAME}"
      - name: install java with maven
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25.0.1'
          java-package: 'jdk+fx'
          cache: 'maven'
      - name: import GPG key
        run: |
          echo "${OSSRH_GPG_PUBLIC_KEY}" | base64 -d | gpg --batch --import
          echo "${OSSRH_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
      - name: release maven artifact
        run: |
          CURRENT_VERSION="$(./mvnw -q -s ./.mvn/settings.xml -Dstyle.color=never -DforceStdout help:evaluate -Dexpression=project.version)"
          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          if [ "${CURRENT_VERSION}" = "${RELEASE_VERSION}" ]; then
            echo "Expected a SNAPSHOT project version, got ${CURRENT_VERSION}" >&2
            exit 1
          fi

          VERSION_PREFIX="${RELEASE_VERSION%.*}"
          VERSION_PATCH="${RELEASE_VERSION##*.}"
          case "${VERSION_PATCH}" in
            ''|*[!0-9]*)
              echo "Cannot calculate next snapshot version from ${RELEASE_VERSION}" >&2
              exit 1
              ;;
          esac
          DEVELOPMENT_VERSION="${VERSION_PREFIX}.$((VERSION_PATCH + 1))-SNAPSHOT"

          ./mvnw -Pmaven-central-publishing,gpg-sign \
                 -Dstyle.color=always \
                 -DskipTests -Darguments="-Dmaven.test.skip=true" \
                 -Dtestfx.headless=true -Djava.awt.headless=true \
                 -B -U -T 1C --errors -Dsurefire.useFile=false \
                 -s ./.mvn/settings.xml \
                 -DreleaseVersion="${RELEASE_VERSION}" \
                 -DdevelopmentVersion="${DEVELOPMENT_VERSION}" \
                 -DpreparationGoals="versions:set-property -Dproperty=papiflyfx.version -DnewVersion=${RELEASE_VERSION} -Dpapiflyfx.version=${RELEASE_VERSION} clean verify" \
                 -DcompletionGoals="versions:set-property -Dproperty=papiflyfx.version -DnewVersion=${DEVELOPMENT_VERSION} -Dpapiflyfx.version=${DEVELOPMENT_VERSION} validate" \
                 release:prepare \
                 release:perform \
                 -DskipTests=true -Djava.security.egd=file:/dev/./urandom -DscmCommentPrefix="[mvn-release] "
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GIT_CONFIG_USER_EMAIL: ${{ secrets.GIT_CONFIG_USER_EMAIL }}
      GIT_CONFIG_USER_NAME: ${{ secrets.GIT_CONFIG_USER_NAME }}
      MAVEN_GITHUB_USERNAME: ${{ secrets.MAVEN_GITHUB_USERNAME }}
      MAVEN_GITHUB_PASSWORD: ${{ secrets.MAVEN_GITHUB_PASSWORD }}
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      OSSRH_TOKEN_USERNAME: ${{ secrets.OSSRH_TOKEN_USERNAME }}
      OSSRH_TOKEN_PASSWORD: ${{ secrets.OSSRH_TOKEN_PASSWORD }}
      OSSRH_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
      OSSRH_GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
      OSSRH_GPG_PUBLIC_KEY: ${{ secrets.OSSRH_GPG_PUBLIC_KEY }}
